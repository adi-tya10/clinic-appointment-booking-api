[project]
name = "clinic-booking"
version = "0.1.0"
description = "REST API for publishing clinic appointment slots and booking them without double-booking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinic_booking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: needs TEST_DATABASE_URL pointing at PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
